[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dwg-reader-skill"
version = "0.8.2"
description = "Extract structured content and multilingual SHX text from DWG/DXF drawings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DWG Reader Skill contributors" }]
dependencies = []

[project.optional-dependencies]
dxf = ["ezdxf>=1.4,<2"]
# 多尺度视觉链路（v2 的局部/细节视图）：缺 Pillow 时识别照常跑，
# 但 vision.health() 会明确报 NO_PILLOW，而不是静默"没有图"。
vision = ["Pillow>=10"]
all = ["ezdxf>=1.4,<2", "Pillow>=10", "openpyxl>=3.1", "mcp>=1.27,<2"]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.27,<2"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
dwg-reader = "dwg_reader.cli:main"
dwg-reader-mcp = "dwg_reader.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dwg-reader/fonts" = [
  "fonts/*.shx",
  "fonts/index.json",
  "fonts/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "scripts",
  "tests/conftest.py",
  "tests/test_decode.py",
  "tests/test_ezdxf.py",
  "tests/test_pipeline.py",
  "tests/test_stream.py",
]
